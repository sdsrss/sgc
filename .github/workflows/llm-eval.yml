name: llm-eval

# Real-LLM evals, kept out of push CI (model output is nondeterministic, so a
# red run would not say which change broke it). Two uses:
#
# 1. Weekly (schedule): is the RUNTIME DEFAULT model still served, and does it
#    still produce output sgc accepts? Runs tests/eval/planner-eng-llm.test.ts
#    with no model override, i.e. the model users get. Not the full smoke: on
#    2026-11-01 the default (anthropic/claude-opus-4.7) failed a
#    researcher.history quality assertion (30-word reason cap, reference
#    match) in 2 of 5 smoke runs, which would make a weekly red/green mostly
#    noise; planner.eng passed in all 6 runs on that model.
# 2. Manual (workflow_dispatch): measure a suite against any model.
#
# Needs repo secret OPENROUTER_API_KEY. Use a dedicated OpenRouter key with a
# spending limit (OpenRouter keys take `limit` + `limit_reset`). Without the
# secret this workflow FAILS: the old smoke step in test.yml skipped silently
# for months because no key was set, and a check that cannot run must not
# look green.
#
# Cost measured 2026-11-01 on the default model: researcher-history +
# planner-eng ≈ $0.05–0.12 per run; the full LLM set ≈ $0.72 per run.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: "planner-eng (weekly check) | smoke (+ researcher-history) | full (every real-LLM eval)"
        type: choice
        options: [planner-eng, smoke, full]
        default: planner-eng
      model:
        description: "OpenRouter model id (empty = sgc's runtime default)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: llm-eval
  cancel-in-progress: false

jobs:
  llm-eval:
    name: llm eval (${{ inputs.suite || 'planner-eng' }}, ${{ inputs.model || 'runtime default' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: npm ci

      - name: Require the OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::repo secret OPENROUTER_API_KEY is not set; this eval cannot run (and must not pass by skipping)"
            exit 1
          fi

      - name: Run the eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUITE: ${{ inputs.suite || 'planner-eng' }}
          MODEL: ${{ inputs.model }}
        run: |
          set -o pipefail
          case "$SUITE" in
            planner-eng) FILES="tests/eval/planner-eng-llm.test.ts" ;;
            smoke) FILES="tests/eval/researcher-history-llm.test.ts tests/eval/planner-eng-llm.test.ts" ;;
            full) FILES="$(grep -l hasLiveLlmKey tests/eval/*-llm.test.ts | tr '\n' ' ')" ;;
            *) echo "::error::unknown suite $SUITE"; exit 1 ;;
          esac
          if [ -n "$MODEL" ]; then export SGC_OPENROUTER_MODEL="$MODEL"; fi
          # shellcheck disable=SC2086 # FILES is a space-separated list on purpose
          bun test $FILES 2>&1 | tee llm-eval-output.log
          # Every selected test must have RUN: a pass with 0 tests run is the
          # silent-skip failure this workflow exists to prevent.
          if grep -E '^\s*[0-9]+ skip$' llm-eval-output.log | grep -v -E '^\s*0 skip$'; then
            echo "::error::some LLM tests were skipped"
            exit 1
          fi

      - name: Publish output to step summary (on failure)
        if: failure()
        run: |
          {
            echo "## llm-eval output (failed run)"
            echo ""
            echo '```'
            tail -200 llm-eval-output.log 2>/dev/null || echo "(no llm-eval-output.log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
