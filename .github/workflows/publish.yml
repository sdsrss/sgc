name: publish-npm

# Triggered by pushing a `v*` tag (e.g. `v1.3.0`). Tag must match the
# version field in package.json — the publish step refuses if they differ.
#
# Auth: npm trusted publishing (GitHub Actions OIDC). No npm token.
# `npm publish` exchanges this run's OIDC token (hence `id-token: write`
# below) for a short-lived publish credential. One-time setup on npmjs.com:
# @sdsrs/sgc → Settings → Trusted publishing → GitHub Actions:
#   Organization or user: sdsrss
#   Repository:           sgc
#   Workflow filename:    publish.yml
#   Environment:          (empty; the publish job sets no `environment:`)
# Renaming this file, moving `npm publish` into another workflow, or giving
# the job an `environment:` breaks that match and the publish fails
# (401/403/404). Fix the npmjs.com values or the permission; do not add a
# token back.
#
# Why no NODE_AUTH_TOKEN / NPM_TOKEN at any level (step, job, workflow): npm
# 11 tries OIDC first and, if that fails, quietly falls back to a token in
# the environment. With a token present, a broken trust configuration still
# publishes and the job stays green; without one, it fails here instead.
#
# Before tagging: bump package.json + plugins/sgc/.claude-plugin/plugin.json
# versions in lockstep (the verify step below enforces it).
#
# Tag → publish flow:
#   git tag v1.3.0
#   git push origin v1.3.0           # fires this workflow
# Then confirm the version went out through trusted publishing (a green job
# alone does not show that):
#   npm view @sdsrs/sgc@<version> _npmUser
#   # expected: GitHub Actions <npm-oidc-no-reply@github.com>
#
# Provenance: the package is published with --provenance, which embeds a
# signed attestation linking the published tarball to this exact GitHub
# Actions run + commit SHA. Under trusted publishing npm generates it
# automatically; the flag is kept as an explicit statement of intent.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # trusted publishing (OIDC auth) + provenance; publish fails without it

jobs:
  publish:
    name: npm publish (with provenance)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node (for npm publish + registry auth)
        # Node 24, not 20/22: trusted publishing needs npm >= 11.5.1 and
        # Node >= 22.14.0, and Node 20 and 22 bundle npm 10.
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: npm ci

      # P3-8 (audit v1.31.8): publish gated on less than push did.
      # test.yml runs typecheck before its tests; this workflow ran neither, so
      # the normal tag-after-green-main flow was only covered by coincidence —
      # a tag pushed onto a commit whose test.yml had not gone green (or had
      # never run, e.g. a tag on an older commit) published on the dispatcher
      # suite alone. bun strips types at runtime, so a type error is invisible
      # to `bun test` and would have shipped.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Bundle parity (committed == rebuild)
        run: git diff --exit-code plugins/sgc/bin/sgc.mjs || (echo "stale bundle — rebuild + commit before tagging" >&2; exit 1)

      - name: Verify tag matches package.json AND plugin.json version
        # B7/CI-1 (audit v1.37.0): the tag↔package.json check was machine-
        # enforced, but plugin.json (the Claude Code plugin channel's version)
        # was kept in lockstep only by a setup-note comment. A tag could publish
        # an npm package at vX while the plugin manifest still said vX-1. Lock
        # all three: tag == package.json == plugin.json.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          PLUGIN_VERSION="$(node -p 'require("./plugins/sgc/.claude-plugin/plugin.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME (-> $TAG_VERSION) != package.json version $PKG_VERSION" >&2
            exit 1
          fi
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "ERROR: package.json version $PKG_VERSION != plugin.json version $PLUGIN_VERSION (bump both in lockstep)" >&2
            exit 1
          fi
          echo "OK: publishing $PKG_VERSION (package.json == plugin.json == tag)"

      - name: Run dispatcher + eval tests (gate publish)
        # B7/CI-1: mirror test.yml's gate — it runs dispatcher + eval, so a
        # tag-time gate on the dispatcher suite ALONE let an eval-covered
        # regression through whenever the tag did not sit on a green test.yml run
        # (e.g. a tag on an older commit). LLM eval tests skipIf no key, so this
        # adds the deterministic eval coverage without needing a CI API key.
        run: SGC_FORCE_INLINE=1 bun test tests/dispatcher tests/eval

      - name: Publish to npm
        # No token env here on purpose; see "Auth" at the top of this file.
        run: npm publish --access public --provenance
