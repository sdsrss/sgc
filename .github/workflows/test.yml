name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # P2-12 (audit v1.31.8): the two install-surface promises had no CI behind
  # them. package.json says `engines.node: >=18` and the README sells "one
  # command, npx/global, node ≥ 18" — but every job ran Node 24 only, and
  # tests/e2e/npm-isolated-install.test.sh existed while being wired into
  # nothing. Both claims were asserted, never tested. This job tests them: it
  # packs the real tarball, installs it into a clean tree, and drives the
  # shipped bundle under the OLDEST Node we advertise.
  npm-install-node18:
    name: npm consumer install (node 18 — the floor we advertise)
    runs-on: ubuntu-latest
    env:
      # The bundle never launches a browser here; skip the ~100MB chromium
      # fetch (playwright is optional and lazily imported).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 18 (engines floor)
        uses: actions/setup-node@v5
        with:
          node-version: "18"

      - name: Setup Bun (build only — consumers never need it)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: npm ci

      - name: Isolated npm-consumer install + run (e2e)
        # Packs, installs into a temp tree, then runs `--version` and `doctor`
        # off the installed bin — the exact path an `npm i -g @sdsrs/sgc` user
        # takes. Fails loudly if the bundle needs anything Node 18 lacks.
        run: bash tests/e2e/npm-isolated-install.test.sh

  dispatcher-eval:
    name: dispatcher + eval
    runs-on: ubuntu-latest
    env:
      # Skip chromium download — browse tests are not in this scope and
      # the binary is ~100MB from the MS CDN (adds ~9 min on a clean cache).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node (for npm ci)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # Cache npm's ~/.npm using the lockfile as the key.
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        # `npm ci` because the repo tracks package-lock.json (not bun.lock).
        # Bun still reads package-lock.json fine at runtime.
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        # Strict-mode gate: bun strips types at runtime so type errors never
        # surface in `bun test`. Run tsc explicitly to keep the strict baseline
        # green (typescript pinned in devDependencies). Fail-fast before tests.
        run: npm run typecheck

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Bundle parity (committed == rebuild)
        run: |
          git diff --exit-code plugins/sgc/bin/sgc.mjs \
            || (echo "ERROR: committed bundle is stale — run 'npm run build:cli' and commit" >&2; exit 1)

      - name: Run dispatcher + eval tests
        id: run_tests
        run: |
          set -o pipefail
          bun test tests/dispatcher tests/eval 2>&1 | tee test-output.log

      - name: Publish test output to step summary (on failure)
        if: always() && steps.run_tests.outcome == 'failure'
        run: |
          {
            echo "## bun test output (failed run)"
            echo ""
            echo '```'
            tail -200 test-output.log || echo "(no test-output.log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ──────────────────────────────────────────────────────────────────────
      # LLM-eval smoke (P1.5 — audit follow-up).
      #
      # Runs the two most regression-prone real-LLM eval files —
      # researcher-history-llm (exercises coerceLlmOutput's 6 guards) and
      # planner-eng-llm (exercises banned-vocab + manifest schema). Catches
      # drift between the prompt templates / dispatcher coercion and real
      # model output.
      #
      # Gating: when OPENROUTER_API_KEY secret is unset (default + fork PRs),
      # the env var lands as an empty string, the test files' `test.skipIf
      # (!process.env.OPENROUTER_API_KEY && !process.env.ANTHROPIC_API_KEY)`
      # short-circuits, and the step passes in seconds with 0 LLM calls.
      # Trusted-contributor pushes / main pushes (where the secret is
      # available) actually exercise the LLM path.
      #
      # Model pin: sonnet-4 is the calibration baseline these tests were
      # tuned against. The runtime default in src/dispatcher/openrouter-
      # agent.ts is now opus-4.7 for user-facing work, but for CI eval we
      # need stability over recency — opus-4.7 hallucinates extra
      # manifest-undeclared fields that fail §9 (the planner.eng s2
      # `rate_limit_unstated_behaviors` symptom). SGC_OPENROUTER_MODEL
      # override pins back to sonnet-4 for the smoke run.
      #
      # Cost: ~8 LLM calls per run at sonnet-4 pricing ≈ $0.05 - $0.10.
      - name: LLM-eval smoke (sonnet-4 calibrated)
        id: llm_smoke
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SGC_OPENROUTER_MODEL: anthropic/claude-sonnet-4
        run: |
          set -o pipefail
          bun test \
            tests/eval/researcher-history-llm.test.ts \
            tests/eval/planner-eng-llm.test.ts \
            2>&1 | tee llm-smoke-output.log

      - name: Publish LLM-smoke output to step summary (on failure)
        if: always() && steps.llm_smoke.outcome == 'failure'
        run: |
          {
            echo "## LLM-eval smoke output (failed run)"
            echo ""
            echo '```'
            tail -200 llm-smoke-output.log || echo "(no llm-smoke-output.log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
