name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # P2-12 (audit v1.31.8): the install-surface promises had no CI behind them.
  # This job tests them: it packs the real tarball, installs it into a clean
  # tree, and drives the shipped bundle under Node.
  #
  # v2.0.0: the floor is `engines.node: >=22.19.0` (the oldest Node LTS still
  # maintained upstream), tested at exactly 22.19.0, plus the current 24 and 26
  # lines. Several Node lines, not just the floor, because the proxy e2e guards
  # a bug that depends on the Node version: v1.38.x's proxy support failed on
  # Node 26 only, since Node's built-in fetch bundles its own undici.
  npm-consumer:
    name: npm consumer install + proxy (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24", "26"]
    env:
      # The bundle never launches a browser here; skip the ~100MB chromium
      # fetch (playwright is optional and lazily imported).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Isolated npm-consumer install + run (e2e)
        # Packs the committed bundle, installs it into a temp tree, then runs
        # `--version` and `doctor` off the installed bin — the exact path an
        # `npm i -g @sdsrs/sgc` user takes.
        run: bash tests/e2e/npm-isolated-install.test.sh

      - name: Proxy support through Node's runtime (e2e)
        # Runs the committed bundle's canary health check through a fake
        # CONNECT proxy; fails unless the request went through the proxy.
        run: bash tests/e2e/proxy-canary.test.sh

  dispatcher-eval:
    name: dispatcher + eval
    runs-on: ubuntu-latest
    env:
      # Skip chromium download — browse tests are not in this scope and
      # the binary is ~100MB from the MS CDN (adds ~9 min on a clean cache).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node (for npm ci)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # Cache npm's ~/.npm using the lockfile as the key.
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        # `npm ci` because the repo tracks package-lock.json (not bun.lock).
        # Bun still reads package-lock.json fine at runtime.
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        # Strict-mode gate: bun strips types at runtime so type errors never
        # surface in `bun test`. Run tsc explicitly to keep the strict baseline
        # green (typescript pinned in devDependencies). Fail-fast before tests.
        run: npm run typecheck

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Bundle parity (committed == rebuild)
        run: |
          git diff --exit-code plugins/sgc/bin/sgc.mjs \
            || (echo "ERROR: committed bundle is stale — run 'npm run build:cli' and commit" >&2; exit 1)

      - name: Install zsh
        # The plugin's command blocks run in the user's shell, and Claude
        # Code's Bash tool prefers zsh on macOS. plugin-content.test.ts runs
        # every block under bash and zsh, and fails in CI when zsh is missing.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Run dispatcher + eval tests
        id: run_tests
        run: |
          set -o pipefail
          bun test tests/dispatcher tests/eval 2>&1 | tee test-output.log

      - name: Publish test output to step summary (on failure)
        if: always() && steps.run_tests.outcome == 'failure'
        run: |
          {
            echo "## bun test output (failed run)"
            echo ""
            echo '```'
            tail -200 test-output.log || echo "(no test-output.log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Real-LLM evals do not run on push: model output is nondeterministic,
      # and the old smoke step here never ran (no OPENROUTER_API_KEY secret, so
      # all 8 tests skipped) while pinned to a model since retired. They run in
      # .github/workflows/llm-eval.yml (weekly + manual) against the runtime
      # default model instead.
